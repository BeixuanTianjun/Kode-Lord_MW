<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../Portfolio/css/fonts.css">
<style>
*{box-sizing:border-box;margin:0}
body{width:1584px;height:396px;background:#05060a;color:#eaeefb;
  font-family:"Manrope",sans-serif;overflow:hidden;position:relative}
.aurora{position:absolute;inset:0;filter:blur(88px);opacity:.62}
.aurora i{position:absolute;border-radius:50%;mix-blend-mode:screen;display:block}
.a{width:560px;height:560px;left:-120px;top:-190px;background:radial-gradient(circle,rgba(53,229,255,.6),transparent 66%)}
.b{width:620px;height:620px;left:700px;top:-230px;background:radial-gradient(circle,rgba(157,92,255,.5),transparent 66%)}
.c{width:520px;height:520px;right:-140px;bottom:-250px;background:radial-gradient(circle,rgba(255,77,141,.42),transparent 68%)}
.grid{position:absolute;inset:0;opacity:.32;
  background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:52px 52px;
  -webkit-mask-image:radial-gradient(ellipse 80% 120% at 40% 0%,#000 20%,transparent 80%)}
svg.stars{position:absolute;inset:0;width:100%;height:100%}

/* art cluster — kept clear of the bottom-left, where LinkedIn drops the avatar */
.art{position:absolute;left:286px;top:58px;width:400px;height:250px}

/* text block, right of centre so a mobile crop keeps it */
.txt{position:absolute;left:760px;top:0;height:396px;width:780px;
  display:flex;flex-direction:column;justify-content:center}
h1{font-size:45px;font-weight:800;letter-spacing:-.032em;line-height:1.12;text-transform:uppercase}
h1 em{font-style:normal;background:linear-gradient(100deg,#35e5ff,#9d5cff 50%,#ff4d8d);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.rule{width:74px;height:3px;border-radius:2px;margin:19px 0 17px;
  background:linear-gradient(100deg,#35e5ff,#9d5cff 50%,#ff4d8d)}
.sub{font-size:18.5px;font-weight:500;color:#b6bfd4;line-height:1.5;letter-spacing:.002em}
.sub b{color:#eaeefb;font-weight:700}
.row{display:flex;gap:29px;margin-top:29px;align-items:flex-start}
.row div{display:flex;flex-direction:column;align-items:center;gap:8px;width:90px}
.row span{font-size:11px;font-weight:600;letter-spacing:.055em;color:#9aa4bc;text-align:center;line-height:1.25}
.row svg{stroke:#35e5ff;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
</style></head><body>
<div class="aurora"><i class="a"></i><i class="b"></i><i class="c"></i></div>
<div class="grid"></div>

<svg class="stars" viewBox="0 0 1584 396" aria-hidden="true">
  <g stroke="rgba(157,92,255,.30)" stroke-width="1" fill="none">
    <path d="M120 300 L212 246 L300 288 L246 350 Z"/>
    <path d="M1180 70 L1290 118 L1240 196"/>
    <path d="M1400 250 L1486 206 L1520 292"/>
  </g>
  <g fill="#35e5ff">
    <circle cx="120" cy="300" r="2.6"/><circle cx="300" cy="288" r="2.2"/>
    <circle cx="1290" cy="118" r="2.4"/><circle cx="1486" cy="206" r="2.2"/>
  </g>
  <g fill="#ff4d8d">
    <circle cx="212" cy="246" r="2.2"/><circle cx="1240" cy="196" r="2.4"/><circle cx="1520" cy="292" r="2"/>
  </g>
  <g fill="#9d5cff">
    <circle cx="246" cy="350" r="2"/><circle cx="1180" cy="70" r="2.2"/><circle cx="1400" cy="250" r="2.2"/>
    <circle cx="700" cy="330" r="1.8"/><circle cx="960" cy="360" r="1.6"/>
  </g>
</svg>

<svg class="art" viewBox="0 0 400 250" aria-hidden="true">
  <defs>
    <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#35e5ff"/><stop offset="60%" stop-color="#9d5cff"/><stop offset="100%" stop-color="#ff4d8d"/>
    </linearGradient>
  </defs>

  <!-- chart panel -->
  <rect x="34" y="22" width="258" height="176" rx="13"
        fill="rgba(255,255,255,.035)" stroke="rgba(255,255,255,.16)" stroke-width="1.3"/>
  <line x1="34" y1="52" x2="292" y2="52" stroke="rgba(255,255,255,.14)" stroke-width="1.3"/>
  <circle cx="50" cy="37" r="3.4" fill="#ff4d8d"/><circle cx="62" cy="37" r="3.4" fill="#9d5cff"/><circle cx="74" cy="37" r="3.4" fill="#35e5ff"/>

  <!-- what the market charges -->
  <g stroke="#6f7891" stroke-width="1.5" stroke-linecap="round">
    <line x1="68"  y1="122" x2="68"  y2="172"/><line x1="96"  y1="114" x2="96"  y2="168"/>
    <line x1="124" y1="130" x2="124" y2="180"/><line x1="152" y1="106" x2="152" y2="160"/>
    <line x1="180" y1="114" x2="180" y2="164"/><line x1="208" y1="100" x2="208" y2="152"/>
    <line x1="236" y1="94"  x2="236" y2="150"/>
  </g>
  <g fill="rgba(110,120,145,.5)" stroke="#8b94ab" stroke-width="1.3">
    <rect x="62"  y="134" width="13" height="26" rx="2"/><rect x="90"  y="128" width="13" height="28" rx="2"/>
    <rect x="118" y="144" width="13" height="24" rx="2"/><rect x="146" y="120" width="13" height="30" rx="2"/>
    <rect x="174" y="128" width="13" height="26" rx="2"/><rect x="202" y="114" width="13" height="28" rx="2"/>
    <rect x="230" y="108" width="13" height="30" rx="2"/>
  </g>
  <text x="62" y="190" fill="#6f7891" font-family="ui-monospace,Menlo,monospace"
        font-size="9" font-weight="600" letter-spacing="1.6">PRICE</text>

  <!-- what the business is worth -->
  <path d="M62 168 C104 158, 132 152, 160 138 S218 110, 248 76"
        stroke="url(#g)" stroke-width="3.2" fill="none" stroke-linecap="round"/>
  <circle cx="248" cy="76" r="5.4" fill="#05060a" stroke="#ff4d8d" stroke-width="2.6"/>
  <text x="196" y="70" fill="#ff8ab4" font-family="ui-monospace,Menlo,monospace"
        font-size="9" font-weight="700" letter-spacing="1.6">VALUE</text>

  <!-- the distance between them, which is the whole job -->
  <g stroke="#35e5ff" stroke-width="1.4" stroke-dasharray="4 4" opacity=".9">
    <line x1="268" y1="80" x2="268" y2="120"/>
  </g>
  <path d="M264 84 L268 78 L272 84 M264 116 L268 122 L272 116"
        stroke="#35e5ff" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="256" y="140" fill="#35e5ff" font-family="ui-monospace,Menlo,monospace"
        font-size="8.5" font-weight="700" letter-spacing="1.4">GAP</text>

  <!-- the model that decides the number -->
  <g transform="translate(300 128)">
    <rect x="0" y="0" width="96" height="98" rx="10"
          fill="rgba(5,6,10,.94)" stroke="rgba(255,255,255,.2)" stroke-width="1.3"/>
    <rect x="1" y="1" width="94" height="20" rx="9" fill="rgba(53,229,255,.15)"/>
    <line x1="0" y1="21" x2="96" y2="21" stroke="rgba(255,255,255,.2)" stroke-width="1.2"/>
    <text x="11" y="15.5" fill="#8fdcf0" font-family="ui-monospace,Menlo,monospace"
          font-size="8.5" font-weight="700" letter-spacing="1.3">DCF</text>
    <g stroke="rgba(255,255,255,.32)" stroke-width="1.5" stroke-linecap="round">
      <line x1="12" y1="37" x2="58" y2="37"/><line x1="12" y1="52" x2="72" y2="52"/>
      <line x1="12" y1="67" x2="48" y2="67"/>
    </g>
    <line x1="12" y1="83" x2="68" y2="83" stroke="url(#g)" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>

<div class="txt">
  <h1>Decide what it's worth<br><em>before you look at the price</em></h1>
  <div class="rule"></div>
  <p class="sub"><b>Michael Wibowo</b> &nbsp;·&nbsp; Industrial Engineering @ BINUS<br>
     Financial Modeling &amp; Valuation &nbsp;|&nbsp; Aspiring Investment Banking Analyst</p>
  <div class="row">
    <div><svg width="26" height="26" viewBox="0 0 24 24"><path d="M12 3v18M5 7h14M7 7l-3 6a3.2 3.2 0 0 0 6 0L7 7Zm10 0-3 6a3.2 3.2 0 0 0 6 0l-3-6Z"/></svg><span>VALUATION</span></div>
    <div><svg width="26" height="26" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11M3 14.5h18"/></svg><span>MODELING</span></div>
    <div><svg width="26" height="26" viewBox="0 0 24 24"><path d="M4 20V10M9 20V4M14 20v-7M19 20V7"/></svg><span>IDX EQUITIES</span></div>
    <div><svg width="26" height="26" viewBox="0 0 24 24"><path d="M12 3l7 3v5.5c0 4.3-2.9 7.7-7 9.5-4.1-1.8-7-5.2-7-9.5V6l7-3Z"/><path d="M9.3 12.2l1.9 1.9 3.6-3.9"/></svg><span>RISK</span></div>
    <div><svg width="26" height="26" viewBox="0 0 24 24"><path d="M3 16.5 9 10l4 3.6L21 5"/><path d="M15.5 5H21v5.5"/></svg><span>TRADING</span></div>
    <div><svg width="26" height="26" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.3-4.3M8.6 9.3h4.8M11 9.3V13"/></svg><span>RESEARCH</span></div>
  </div>
</div>
</body></html>
