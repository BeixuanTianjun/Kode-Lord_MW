# Publishes Portfolio/ to GitHub Pages.
#
# ONE-TIME SETUP, required before the first successful run:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
# Until that is set, this workflow fails at the Configure Pages step with
# "Create Pages site failed ... Resource not accessible by integration".
# The GITHUB_TOKEN handed to a workflow cannot create the Pages site itself,
# whatever permissions the workflow requests — only a repo admin can.
#
# The artifact is the Portfolio folder alone, not the repo root, so the site
# lands at the Pages root rather than under /Portfolio/. The other projects in
# this repo are not published by this workflow.
name: Deploy portfolio to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/upbeat-bohr-kvnbxw
    paths:
      - 'Portfolio/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it — a half-applied
# deploy is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Turns Pages on for the repo if it isn't already, so this works
          # without anyone visiting the settings page first.
          enablement: true

      - name: Upload Portfolio/ as the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: Portfolio

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
